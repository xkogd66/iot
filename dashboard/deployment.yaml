apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: iot
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: ghcr.io/xkogd66/iot-dashboard:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: INFLUX_URL
          value: http://influxdb.iot.svc.cluster.local:8086
        - name: GRAFANA_URL
          value: http://grafana.iot.svc.cluster.local
        - name: INFLUX_TOKEN
          valueFrom:
            secretKeyRef:
              name: influxdb-auth
              key: admin-token
        - name: INFLUX_ORG
          valueFrom:
            secretKeyRef:
              name: influxdb-auth
              key: org
        - name: INFLUX_BUCKET
          valueFrom:
            secretKeyRef:
              name: influxdb-auth
              key: bucket
        # Enables the destructive /api/admin/* routes (remove site, reset
        # history). Optional by design: if this key is absent the server still
        # starts and those routes return 503, so a missing secret fails closed.
        #
        # Deliberately NOT admin-password: that key is InfluxDB's own admin
        # login. This dashboard is public-facing, so its admin credential must
        # have its own blast radius — a leak here must not hand over the
        # database.
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: influxdb-auth
              key: dashadmin
              optional: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
