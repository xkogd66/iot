<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ekskog Estate Monitoring</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M4 17h6l3-8 4 14 3-6h8' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #1b1e22;
      --ink-2: #6a7178;
      --line: #e6e8eb;
      --accent: #2563eb;
      --up: #16a34a;
      --down: #dc2626;
      --idle: #9ca3af;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f12;
        --surface: #16191e;
        --ink: #e7e9ec;
        --ink-2: #98a0a8;
        --line: #262b31;
        --accent: #3b82f6;
        --up: #22c55e;
        --down: #f87171;
        --idle: #6b7280;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }
    body {
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); background: var(--bg);
      max-width: 44rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem;
      -webkit-font-smoothing: antialiased;
    }

    header h1 {
      margin: 0; font-size: .95rem; font-weight: 650;
      letter-spacing: .09em; text-transform: uppercase;
    }
    header p { margin: .35rem 0 0; font-size: .8rem; color: var(--ink-2); }

    .controls {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: .9rem;
      margin-top: 1.75rem;
    }
    .field {
      display: flex; flex-direction: column; gap: .3rem;
      font-size: .7rem; font-weight: 600; letter-spacing: .05em;
      text-transform: uppercase; color: var(--ink-2);
    }
    .field select {
      font: inherit; font-size: .9rem; font-weight: 400;
      letter-spacing: 0; text-transform: none;
      color: var(--ink); background: var(--surface);
      border: 1px solid var(--line); border-radius: .5rem; padding: .45rem .6rem;
    }

    .sites { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
    .pill {
      display: inline-flex; align-items: center; gap: .45rem;
      font-size: .82rem; color: var(--ink-2);
      padding: .3rem .7rem .3rem .6rem; border: 1px solid var(--line);
      border-radius: 999px; background: var(--surface);
    }
    .pill::before {
      content: ""; width: .55rem; height: .55rem; border-radius: 50%;
      background: var(--idle); flex: none;
    }
    .pill .site { font-weight: 600; color: var(--ink); }
    .pill .meta { color: var(--ink-2); }
    .pill.up::before { background: var(--up); }
    .pill.down { border-color: color-mix(in srgb, var(--down) 35%, var(--line)); }
    .pill.down::before { background: var(--down); }
    .pill.down .site { color: var(--down); }

    .section {
      margin: 1.75rem 0 0; font-size: .7rem; font-weight: 600;
      letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2);
    }
    .section .muted { font-weight: 400; text-transform: none; letter-spacing: 0; }

    .cards {
      display: grid; gap: .9rem; margin-top: .75rem;
      grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr));
    }
    /* wrap, don't clip: "Temperature" is the longest label and can't shrink
       below its min-content width, so without this the Max/Min control was
       pushed past the card's right edge. */
    .ext-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: .35rem .5rem; flex-wrap: wrap;
    }
    .seg {
      display: inline-flex; border: 1px solid var(--line);
      border-radius: .45rem; overflow: hidden; flex: none;
    }
    .seg button {
      font: inherit; font-size: .68rem; font-weight: 600; letter-spacing: .03em;
      cursor: pointer; padding: .18rem .5rem; border: 0;
      color: var(--ink-2); background: var(--surface);
    }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button.on { color: #fff; background: var(--accent); }
    .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: .75rem; padding: 1.1rem 1.15rem; box-shadow: var(--shadow);
    }
    .card .label {
      font-size: .7rem; font-weight: 600; letter-spacing: .05em;
      text-transform: uppercase; color: var(--ink-2);
    }
    .card .value {
      font-size: 2.1rem; font-weight: 600; line-height: 1;
      font-variant-numeric: tabular-nums; margin-top: .4rem;
    }
    .card .unit { font-size: .95rem; font-weight: 500; color: var(--ink-2); margin-left: .1rem; }
    .admin {
      margin-top: .9rem; padding: 1rem 1.15rem; border-radius: .75rem;
      background: var(--surface); border: 1px solid var(--down);
    }
    .admin-warn { margin: 0 0 .8rem; font-size: .85rem; font-weight: 600; color: var(--down); }
    .admin-pw { display: block; font-size: .8rem; color: var(--ink-2); max-width: 20rem; }
    .admin-pw input {
      display: block; width: 100%; margin-top: .3rem; padding: .45rem .6rem;
      font: inherit; border: 1px solid var(--line); border-radius: .45rem;
      background: var(--bg); color: var(--ink);
    }
    .admin-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .9rem; }
    button.danger {
      font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
      padding: .45rem .9rem; border-radius: .45rem;
      color: #fff; background: var(--down); border: 1px solid var(--down);
    }
    button.danger:disabled { opacity: .5; cursor: not-allowed; }
    button.plain {
      font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
      padding: .45rem .9rem; border-radius: .45rem;
      color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    }
    .card .stamp {
      margin-top: .5rem; font-size: .72rem; color: var(--ink-2);
      font-variant-numeric: tabular-nums; min-height: 1em;
    }

    .note { margin-top: 1.25rem; font-size: .78rem; color: var(--ink-2); }
    .note.error { color: var(--down); }

    .toggle {
      margin-top: 2rem; display: inline-flex; align-items: center; gap: .5rem;
      font: inherit; font-size: .88rem; font-weight: 500; cursor: pointer;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
      border-radius: .5rem; padding: .55rem .9rem;
      transition: background .15s ease, border-color .15s ease;
    }
    .toggle:hover { background: color-mix(in srgb, var(--accent) 15%, var(--surface)); }
    .toggle::after {
      content: "\25be"; font-size: .8em; transition: transform .15s ease;
    }
    .toggle.open::after { transform: rotate(180deg); }

    .charts { margin-top: 1rem; display: grid; gap: .9rem; }
    .charts[hidden] { display: none; }
    .charts iframe {
      width: 100%; height: 15rem; border: 1px solid var(--line);
      border-radius: .75rem; background: var(--surface);
    }

    select:focus-visible, .toggle:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ekskog Estate Monitoring</h1>
    <p>Live from InfluxDB</p>
  </header>

  <div class="sites" id="sites"></div>

  <div class="controls">
    <label class="field">Site
      <select id="site"></select>
    </label>
    <label class="field">Range
      <select id="range">
        <option value="6h">last 6h</option>
        <option value="24h">last 24h</option>
        <option value="7d">last 7 days</option>
      </select>
    </label>
  </div>

  <h2 class="section">Average <span id="avg-range" class="muted"></span></h2>
  <div class="cards">
    <div class="card">
      <div class="label">Temperature</div>
      <div class="value"><span id="temp">–</span><span class="unit">°C</span></div>
    </div>
    <div class="card">
      <div class="label">Humidity</div>
      <div class="value"><span id="humidity">–</span><span class="unit">%</span></div>
    </div>
    <div class="card">
      <div class="label">Pressure</div>
      <div class="value"><span id="pressure">–</span><span class="unit">hPa</span></div>
    </div>
  </div>

  <h2 class="section">Max / min <span id="ext-range" class="muted"></span></h2>
  <div class="cards" id="ext-cards">
    <div class="card ext" data-field="temp">
      <div class="ext-head">
        <span class="label">Temperature</span>
        <span class="seg" role="group" aria-label="Temperature max or min">
          <button type="button" data-agg="max" class="on" aria-pressed="true">Max</button>
          <button type="button" data-agg="min" aria-pressed="false">Min</button>
        </span>
      </div>
      <div class="value"><span class="v">–</span><span class="unit">°C</span></div>
      <div class="stamp"></div>
    </div>
    <div class="card ext" data-field="humidity">
      <div class="ext-head">
        <span class="label">Humidity</span>
        <span class="seg" role="group" aria-label="Humidity max or min">
          <button type="button" data-agg="max" class="on" aria-pressed="true">Max</button>
          <button type="button" data-agg="min" aria-pressed="false">Min</button>
        </span>
      </div>
      <div class="value"><span class="v">–</span><span class="unit">%</span></div>
      <div class="stamp"></div>
    </div>
    <div class="card ext" data-field="pressure">
      <div class="ext-head">
        <span class="label">Pressure</span>
        <span class="seg" role="group" aria-label="Pressure max or min">
          <button type="button" data-agg="max" class="on" aria-pressed="true">Max</button>
          <button type="button" data-agg="min" aria-pressed="false">Min</button>
        </span>
      </div>
      <div class="value"><span class="v">–</span><span class="unit">hPa</span></div>
      <div class="stamp"></div>
    </div>
  </div>

  <p class="note" id="note">Loading…</p>
  <p class="note error" id="err" hidden></p>

  <button id="toggle-charts" class="toggle" type="button">Show charts</button>

  <div class="charts" id="charts" hidden>
    <iframe id="chart-temp" loading="lazy" title="Temperature over time"></iframe>
    <iframe id="chart-humidity" loading="lazy" title="Humidity over time"></iframe>
    <iframe id="chart-pressure" loading="lazy" title="Pressure over time"></iframe>
  </div>

  <button id="toggle-admin" class="toggle" type="button">Admin</button>

  <div class="admin" id="admin" hidden>
    <p class="admin-warn">
      These delete data from InfluxDB permanently. There is no undo and no backup.
    </p>
    <label class="admin-pw">Admin password
      <input type="password" id="admin-pw" autocomplete="current-password">
    </label>
    <div class="admin-actions">
      <button type="button" id="btn-cancel" class="plain">Cancel</button>
      <button type="button" id="btn-reset" class="danger">Reset history</button>
      <button type="button" id="btn-remove" class="danger">Remove site</button>
    </div>
    <p class="muted" id="admin-hint"></p>
    <p class="note" id="admin-note"></p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const sel = $('site');
    const range = $('range');
    const charts = $('charts');
    const toggle = $('toggle-charts');
    let lastSummary = null;

    // Grafana renders the charts; this page is the front door. Panel ids come
    // from grafana/configmap.yaml — keep them in sync. Requests go through
    // this server's /grafana/ proxy (server.js) so the iframe is same-origin
    // regardless of where the browser is — no LAN-only IP, no mixed content.
    const GRAFANA = '/grafana';
    const PANELS = { temp: 1, humidity: 2, pressure: 3 };

    // A board that's up publishes every ~minute; allow a few missed sends before
    // calling it down so a single dropped message doesn't flip the indicator.
    const STALE_MS = 3 * 60 * 1000;

    function relTime(ms) {
      const s = Math.round(ms / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.round(m / 60);
      if (h < 24) return `${h}h ago`;
      return `${Math.round(h / 24)}d ago`;
    }

    function pillMeta(lastSeen) {
      if (!lastSeen) return { up: false, meta: 'offline' };
      const age = Date.now() - new Date(lastSeen).getTime();
      const up = age < STALE_MS;
      return { up, meta: up ? relTime(age) : `offline · ${relTime(age)}` };
    }

    // One pill per site, showing which boards are reporting. The word "offline"
    // (not just the red dot) marks the down state so it isn't color-alone.
    async function refreshStatus() {
      try {
        const r = await fetch('/api/status');
        const { statuses, error } = await r.json();
        if (error) throw new Error(error);
        syncSites(statuses);
        // Built as DOM, not an HTML string: site names come from MQTT topics on
        // a public anonymous broker, so interpolating them into markup would let
        // anyone who can publish inject script into this page.
        $('sites').replaceChildren(
          ...statuses.map(({ site, lastSeen }) => {
            const { up, meta } = pillMeta(lastSeen);
            const pill = document.createElement('span');
            pill.className = `pill ${up ? 'up' : 'down'}`;

            const name = document.createElement('span');
            name.className = 'site';
            name.textContent = site;

            const info = document.createElement('span');
            info.className = 'meta';
            info.textContent = meta;

            pill.append(name, info);
            return pill;
          }),
        );
      } catch (e) {
        /* keep the last-rendered pills on a transient fetch error */
      }
    }

    // Charts are opt-in: three live Grafana panels each proxy Flux queries into
    // InfluxDB on a refresh loop, so we only load their iframes once the user
    // asks, and only redraw them while they're on screen.
    function drawCharts() {
      if (charts.hidden || !sel.value) return;
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      for (const [field, panelId] of Object.entries(PANELS)) {
        const url = new URL(`${GRAFANA}/d-solo/iot-telemetry/telemetry`, location.origin);
        url.search = new URLSearchParams({
          orgId: '1',
          panelId: String(panelId),
          'var-site': sel.value,
          from: `now-${range.value}`,
          to: 'now',
          theme: dark ? 'dark' : 'light',
        });
        $(`chart-${field}`).src = url.toString();
      }
    }

    // Errors get their own line: overwriting the "Updated" note used to hide how
    // old the numbers on screen were, exactly when that mattered most.
    function fail(message) {
      $('err').textContent = message;
      $('err').hidden = false;
    }

    function clearError() {
      $('err').hidden = true;
      $('err').textContent = '';
    }

    // Wipe the readings. Without this a failed fetch left the PREVIOUS site's
    // values on screen under the newly selected site's name.
    function blankReadings() {
      for (const f of ['temp', 'humidity', 'pressure']) $(f).textContent = '–';
      for (const card of document.querySelectorAll('.card.ext')) {
        card.querySelector('.v').textContent = '–';
        card.querySelector('.stamp').textContent = '';
      }
      $('note').textContent = 'No data';
    }

    // Keep the dropdown in step with the sites actually reporting. Rebuilt only
    // when the set changes, so it never steals focus or drops the selection
    // mid-use; a board provisioned to a new site now appears without a reload.
    function syncSites(statuses) {
      const names = statuses.map(({ site }) => site);
      const current = [...sel.options].map((o) => o.value);
      if (names.length === current.length && names.every((n, i) => n === current[i])) return;

      const chosen = sel.value;
      // new Option() sets textContent, not HTML. Site names come from MQTT
      // topics on a public anonymous broker, so anyone who can publish could
      // otherwise inject markup here.
      sel.replaceChildren(...names.map((site) => new Option(site)));
      if (names.includes(chosen)) sel.value = chosen;
    }

    function fmtTime(iso) {
      return new Date(iso).toLocaleString([], {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
    }

    // Everything below draws from the stored summary. Each max/min card carries
    // both extremes, so toggling Max/Min in a card just re-renders — no refetch.
    function render() {
      if (!lastSummary) return;
      for (const f of ['temp', 'humidity', 'pressure']) {
        $(f).textContent = lastSummary.averages?.[f] ?? '–';
      }
      const rangeLabel = `· ${range.options[range.selectedIndex].text}`;
      $('avg-range').textContent = rangeLabel;
      $('ext-range').textContent = rangeLabel;
      for (const card of document.querySelectorAll('.card.ext')) {
        const field = card.dataset.field;
        const which = card.querySelector('.seg .on').dataset.agg;
        const e = lastSummary.extremes?.[field]?.[which];
        card.querySelector('.v').textContent = e ? e.value : '–';
        card.querySelector('.stamp').textContent = e ? fmtTime(e.time) : 'no data';
      }
      $('note').textContent = 'Updated ' + new Date().toLocaleTimeString();
    }

    // Per-card Max/Min switch — flips this card only, redraws from stored data.
    $('ext-cards').addEventListener('click', (ev) => {
      const btn = ev.target.closest('.seg button');
      if (!btn) return;
      for (const b of btn.parentElement.querySelectorAll('button')) {
        const on = b === btn;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      }
      render();
    });

    async function refresh() {
      if (!sel.value) return;
      try {
        const r = await fetch(
          `/api/summary?site=${encodeURIComponent(sel.value)}&range=${encodeURIComponent(range.value)}`,
        );
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        lastSummary = d;
        clearError();
        render();
      } catch (e) {
        // Drop the stale summary too — showing one site's numbers under
        // another site's name is worse than showing nothing.
        lastSummary = null;
        blankReadings();
        fail(e.message);
      }
    }

    function clearCharts() {
      for (const field of Object.keys(PANELS)) $(`chart-${field}`).removeAttribute('src');
    }

    toggle.addEventListener('click', () => {
      charts.hidden = !charts.hidden;
      toggle.classList.toggle('open', !charts.hidden);
      toggle.textContent = charts.hidden ? 'Show charts' : 'Hide charts';
      if (charts.hidden) clearCharts();
      else drawCharts();
    });

    // ---- Admin. Both actions delete from InfluxDB with no undo, so each one
    // spells out the exact site and window in the confirm dialog before it
    // sends anything. The password is never stored — only sent per request.
    const admin = $('admin');
    const adminToggle = $('toggle-admin');

    // Closing always wipes the password field — leaving it filled behind a
    // collapsed panel is a delete button one click from being armed.
    function closeAdmin() {
      $('admin-pw').value = '';
      adminSay('', false);
      admin.hidden = true;
      adminToggle.classList.remove('open');
    }

    adminToggle.addEventListener('click', () => {
      if (!admin.hidden) return closeAdmin();
      admin.hidden = false;
      adminToggle.classList.add('open');
      adminHint();
    });

    $('btn-cancel').addEventListener('click', closeAdmin);

    function adminHint() {
      const rangeText = range.options[range.selectedIndex].text;
      $('admin-hint').textContent =
        `Reset history: deletes readings for "${sel.value}" older than ${rangeText}. ` +
        `Remove site: deletes every reading "${sel.value}" has ever recorded.`;
    }

    function basicAuth(pw) {
      // btoa() rejects anything outside Latin-1, so encode UTF-8 first.
      return 'Basic ' + btoa(String.fromCharCode(...new TextEncoder().encode(`admin:${pw}`)));
    }

    function adminSay(message, isError) {
      $('admin-note').className = isError ? 'note error' : 'note';
      $('admin-note').textContent = message;
    }

    async function adminCall(action) {
      const pw = $('admin-pw').value;
      if (!pw) return adminSay('Enter the admin password.', true);
      if (!sel.value) return adminSay('No site selected.', true);

      // Pin the site and range BEFORE confirming, and send exactly what was
      // confirmed. The dropdown rebuilds itself on the 30s status poll, so
      // re-reading sel.value afterwards could delete a site the user never saw
      // in the dialog.
      const site = sel.value;
      const rangeKey = range.value;
      const rangeText = range.options[range.selectedIndex].text;

      const what = action === 'remove'
        ? `Permanently delete ALL data for "${site}"?`
        : `Permanently delete data for "${site}" older than ${rangeText}?`;
      if (!confirm(`${what}\n\nThis cannot be undone.`)) return;

      const params = new URLSearchParams({ site });
      if (action === 'reset') params.set('range', rangeKey);

      const buttons = [...document.querySelectorAll('button.danger')];
      for (const b of buttons) b.disabled = true;
      adminSay('Working…', false);
      try {
        const r = await fetch(`/api/admin/${action}?${params}`, {
          method: 'POST',
          headers: { Authorization: basicAuth(pw) },
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || `failed (${r.status})`);
        // Report the actual point counts: Influx answers 204 to a delete whose
        // predicate matched nothing, so "it worked" has to be measured.
        const deleted = d.before - d.remaining;
        const detail = `${deleted} of ${d.before} readings deleted, ${d.remaining} remain`;
        if (d.remaining > 0 && action === 'remove') {
          adminSay(`"${d.site}": ${detail} — the delete did NOT fully take.`, true);
        } else {
          adminSay(
            action === 'remove'
              ? `Removed "${d.site}" — ${detail}.`
              : `Reset "${d.site}" — ${detail}, kept since ` +
                `${new Date(d.keptSince).toLocaleString()}.`,
            false,
          );
        }
        await tick();
        adminHint();
      } catch (e) {
        adminSay(e.message, true);
      } finally {
        for (const b of buttons) b.disabled = false;
      }
    }

    $('btn-remove').addEventListener('click', () => adminCall('remove'));
    $('btn-reset').addEventListener('click', () => adminCall('reset'));

    // Site/range changes refetch and redraw the panels (panels only when
    // visible). The per-card Max/Min buttons re-render without refetching.
    sel.addEventListener('change', () => { refresh(); drawCharts(); adminHint(); });
    range.addEventListener('change', () => { refresh(); drawCharts(); adminHint(); });

    // Status first so the dropdown has options before the first summary fetch.
    async function tick() {
      await refreshStatus();
      refresh();
    }
    tick().catch((e) => fail(e.message));
    setInterval(tick, 30000);
  </script>
</body>
</html>
